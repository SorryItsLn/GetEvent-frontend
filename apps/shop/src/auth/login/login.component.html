<form appearance="floating" class="login__form" tuiCardLarge tuiForm="m" [formRoot]="loginForm">
  <tui-textfield>
    <input placeholder="Email" tuiInput type="email" [formField]="loginForm.email" />
  </tui-textfield>

  <tui-textfield>
    <input placeholder="Пароль" tuiInput type="password" [formField]="loginForm.password" />
  </tui-textfield>

  <button class="login__button" tuiButton type="submit">Войти</button>

  <a tuiLink [routerLink]="REGISTER_ROUTE">Зарегистрироваться</a>
</form>
