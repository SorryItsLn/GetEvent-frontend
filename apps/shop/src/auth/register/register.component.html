<form
  appearance="floating"
  class="register__form"
  tuiCardLarge
  tuiForm="m"
  [formRoot]="registerForm"
>
  <tui-textfield>
    <input placeholder="Email" tuiInput type="email" [formField]="registerForm.email" />
  </tui-textfield>

  <tui-textfield>
    <input placeholder="Пароль" tuiInput type="password" [formField]="registerForm.password" />
  </tui-textfield>

  <tui-textfield>
    <input placeholder="Имя пользователя" tuiInput [formField]="registerForm.userName" />
  </tui-textfield>

  <button class="register__button" tuiButton type="submit">Зарегистрироваться</button>

  <a tuiLink [routerLink]="LOGIN_ROUTE">Войти</a>
</form>
