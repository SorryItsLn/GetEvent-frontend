<div class="event-list">
  <header class="header">
    <h2 class="header__title">Мероприятия</h2>
    <div class="header__create">
      <a size="s" tuiButton [routerLink]="[EVENT_CREATION_ROUTE]">Создать</a>
    </div>
  </header>
  <section class="section">
    @for (item of events()?.items; track item.id) {
      <app-event-card [category]="eventCategoriesEntityMap()[item.categoryId]" [event]="item" />
    }
  </section>
</div>
