<div class="event-creation">
  <header class="header">
    <div class="header__title">Новое мероприятие</div>
    <div class="header__subtitle">Заполните основные детали — остальное можно поправить позже</div>
  </header>

  <section class="section__form">
    <form class="section__form-body" [formGroup]="eventForm" (ngSubmit)="createEvent()">
      <div>
        <h4 class="section__field-label">Название</h4>
        <tui-textfield>
          <label for="title" tuiLabel>Например: вечер настольных игр</label>
          <input formControlName="title" id="title" tuiInput />
        </tui-textfield>
      </div>

      <div>
        <h4 class="section__field-label">Описание</h4>
        <tui-textfield>
          <label for="description" tuiLabel>Расскажите, что участников ждет на мероприятии</label>
          <textarea formControlName="description" id="description" tuiTextarea></textarea>
        </tui-textfield>
      </div>

      <div class="section__field-row">
        <div class="section__field-item">
          <h4 class="section__field-label">Дата начала мероприятия</h4>
          <tui-textfield>
            <input formControlName="startDate" id="startDate" tuiInputDate />
            <tui-calendar *tuiDropdown />
          </tui-textfield>
        </div>

        <div class="section__field-item">
          <h4 class="section__field-label">Дата окончания мероприятия</h4>
          <tui-textfield>
            <input formControlName="endDate" id="endDate" tuiInputDate />
            <tui-calendar *tuiDropdown />
          </tui-textfield>
        </div>

        <div class="section__field-item">
          <h4 class="section__field-label">Дедлайн регистрации</h4>
          <tui-textfield>
            <input formControlName="registrationDeadline" id="registrationDeadline" tuiInputDate />
            <tui-calendar *tuiDropdown />
          </tui-textfield>
        </div>
      </div>

      <div class="section__field-row">
        <div class="section__field-item">
          <h4 class="section__field-label">Категория</h4>
          <tui-textfield tuiChevron [stringify]="stringifyCategory">
            <input formControlName="category" id="category" tuiSelect />
            <tui-data-list-wrapper *tuiDropdown [items]="eventCategories()" />
          </tui-textfield>
        </div>

        <div class="section__field-item">
          <h4 class="section__field-label">Максимум участников</h4>
          <tui-textfield>
            <input formControlName="maxParticipants" id="maxParticipants" tuiInput type="number" />
          </tui-textfield>
        </div>
      </div>

      <div>
        <h4 class="section__field-label">Площадка</h4>
        <app-input-venue formControlName="venue" />
      </div>

      <div class="section__separator"></div>

      <div class="section__form-footer">
        <button size="m" tuiButton type="submit">Создать мероприятие</button>
        <a appearance="outline" size="m" tuiButton [routerLink]="EVENT_LIST_ROUTE">Отмена</a>
      </div>
    </form>
  </section>
</div>
